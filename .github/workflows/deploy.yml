name: Deploy NFL Pick'em

on:
  push:
    branches: [feat/compact-pick-sheet, main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy Supabase even when no backend files changed
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine deployment scope
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_BACKEND: ${{ inputs.deploy_backend }}
        run: bash scripts/deployment-scope.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify public configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - name: Run tests
        run: npm test -- --pool=forks --maxWorkers=1
      - name: Run deployment scope checks
        run: npm run test:deployment
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Build Pages bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-functions:
    needs: [verify, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Apply database migrations
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PROJECT_ID"
          supabase link --project-ref "$PROJECT_ID"
          supabase db push --linked --yes
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy --use-api --project-ref "$PROJECT_ID"

  deploy-pages:
    needs: [verify, changes, deploy-functions]
    if: >-
      ${{ always() && !cancelled() && needs.verify.result == 'success' &&
          needs.changes.result == 'success' &&
          (needs.deploy-functions.result == 'success' ||
           (needs.changes.outputs.backend == 'false' && needs.deploy-functions.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
